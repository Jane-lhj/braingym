# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: braingym
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: USE_LLM
        value: "true"
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_API_KEY
        sync: false
