<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}健脑房 BrainGym{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brain: { 50: '#f0f5ff', 100: '#e0eaff', 200: '#c2d5ff', 400: '#6d9aff', 500: '#4f7df9', 600: '#3b5ee6', 700: '#2d46b3', 800: '#1e3080', 900: '#0f1a4d' },
                        critical: '#EF4444',
                        question: '#3B82F6',
                        creative: '#8B5CF6',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; }
        .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); }
        .gradient-bg { background: linear-gradient(135deg, #0f1a4d 0%, #1e3080 30%, #2d46b3 60%, #4f7df9 100%); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .score-ring { transition: stroke-dashoffset 1s ease-in-out; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .translation-toggle {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            right: 12px;
            z-index: 90;
            min-width: 76px;
            height: 38px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.92);
            color: #1f2937;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
            font-size: 13px;
            font-weight: 700;
            transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
        }
        .translation-toggle:hover { transform: translateY(-1px); background: #fff; }
        .translation-toggle:disabled { cursor: wait; opacity: 0.72; transform: none; }
        .translation-status {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 58px);
            right: 12px;
            z-index: 90;
            max-width: min(320px, calc(100vw - 24px));
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(17, 24, 39, 0.92);
            color: white;
            font-size: 12px;
            line-height: 1.45;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.25);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .translation-status.show { opacity: 1; transform: translateY(0); }
        .contact-entry {
            position: fixed;
            right: 14px;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
            z-index: 80;
            max-width: calc(100vw - 28px);
            color: rgba(107, 114, 128, 0.92);
            font-size: 11px;
            line-height: 1.4;
            text-align: right;
            pointer-events: none;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <button id="languageToggle" type="button" class="translation-toggle" data-no-translate aria-label="Translate page to English">English</button>
    <div id="translationStatus" class="translation-status" data-no-translate role="status" aria-live="polite"></div>
    <div class="contact-entry">联系邮箱 hello.lhj@foxmail.com</div>
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
    <script src="/static/js/translate.js"></script>
</body>
</html>
